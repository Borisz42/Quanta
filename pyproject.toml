[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta"
version = "0.1.0"
description = "QUANTA: Neuro-Symbolic 1024-Dimension Quaternary Vector Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "QUANTA Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "blake3>=0.3.3",
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    "clingo>=5.6.0",
    "torch>=2.0.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "typeguard>=4.0.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", "build", "dist", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
